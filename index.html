<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ffd1dc,#ffe6f0);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.container {
    text-align: center;
}

h1 {
    font-size: 3rem;
    color: #e91e63;
    margin-bottom: 20px;
}

p {
    font-size: 1.2rem;
    color: #444;
    margin-bottom: 40px;
}

button {
    font-size: 1.3rem;
    padding: 20px 40px;
    border-radius: 50px;
    border: none;
    background: #e91e63;
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(233,30,99,0.5);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 15px 30px rgba(233,30,99,0.6);
}

#message {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: white;
    background: linear-gradient(135deg,#ff4d6d,#ffb6c1);
    padding: 40px 60px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    opacity: 0;
    transition: all 1s ease;
    z-index: 10;
}

#message.show {
    top: 50%;
    transform: translate(-50%, -50%);
    opacity: 1;
    animation: popHeart 1s forwards;
}

@keyframes popHeart {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.heart {
    position: absolute;
    font-size: 3rem;
    color: #ff4d6d;
    opacity: 0;
    animation: floatHeart 2s forwards;
}

@keyframes floatHeart {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    50% { opacity: 1; transform: translateY(-50px) scale(1.2); }
    100% { transform: translateY(-150px) scale(1); opacity: 0; }
}
</style>
</head>
<body>

<div class="container">
    <h1>Hey beautiful 💖</h1>
    <p>Click the heart below to see something special for you</p>
    <button id="heartBtn">💌 Click Me!</button>
</div>

<div id="message">I love you more than words can say ❤️</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2023/03/03/audio_1b28f0bbf4.mp3?filename=soft-inspirational-background-7186.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById('heartBtn');
const message = document.getElementById('message');
const music = document.getElementById('music');

// When clicked, show the message, play music, and float hearts
btn.addEventListener('click', () => {
    // Show heartfelt message
    message.classList.add('show');

    // Play music
    music.currentTime = 0;
    music.play();

    // Create multiple floating hearts
    for (let i = 0; i < 20; i++) {
        createFloatingHeart();
    }
});

// Function to create a floating heart
function createFloatingHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = '❤️';
    heart.style.left = Math.random() * 90 + 'vw';
    heart.style.top = window.innerHeight + 'px';
    heart.style.fontSize = (20 + Math.random() * 40) + 'px';
    heart.style.animationDuration = (2 + Math.random() * 3) + 's';
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 4000);
}
</script>
</body>
</html>
