<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffe6ed, #ffd1dc);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
  z-index: 2;
}

.screen.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

h1 { font-size: 2.5rem; color: #b03060; margin-bottom: 10px; }
p { font-size: 1.15rem; max-width: 520px; color: #444; line-height: 1.7; }

button {
  margin-top: 35px;
  padding: 16px 42px;
  border: none;
  border-radius: 50px;
  background: #ff4d6d;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(255,77,109,0.6);
  transition: transform 0.3s ease;
}

button:hover { transform: scale(1.08); }
.pulse { animation: pulse 1.4s infinite; }
@keyframes pulse {0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}

#hearts { position: absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }

.heart {
  position: absolute;
  font-size: 24px;
  color: rgba(255,77,109,0.8);
  animation: float linear forwards;
}
@keyframes float {
  0% { transform: translateY(100vh) scale(0.7); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
}

/* Heartfelt message */
#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, 40px);
  font-size: 2rem;
  color: white;
  background: linear-gradient(135deg,#ff4d6d,#ffb6c1);
  padding: 40px 60px;
  border-radius: 20px;
  text-align: center;
  opacity: 0;
  transition: all 0.8s ease;
  z-index: 3;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
#message.show {
  opacity: 1;
  transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div class="screen active">
  <h1>Hey you ❤️</h1>
  <p>I made this just for you.</p>
  <button onclick="next()">Start</button>
</div>

<div class="screen">
  <h1>A little truth</h1>
  <p>You make everything feel softer, warmer, and more meaningful.</p>
  <button onclick="next()">Next</button>
</div>

<div class="screen">
  <h1>One more thing</h1>
  <p>I don’t just like being with you — I feel right with you.</p>
  <button onclick="next()">Okay ❤️</button>
</div>

<div class="screen">
  <h1>Will you be my Valentine? 💘</h1>
  <button class="pulse" onclick="celebrate()">Yes</button>
</div>

<div id="message">Every moment with you feels like a song worth remembering. I love you ❤️</div>
<div id="hearts"></div>

<!-- YouTube Player for Youth by Daughter -->
<iframe id="ytplayer"
    style="display:none"
    width="0" height="0"
    src="https://www.youtube.com/embed/VEpMj-tqixs?enablejsapi=1"
    frameborder="0" allow="autoplay; encrypted-media">
</iframe>

<script>
const screens = document.querySelectorAll('.screen');
let index = 0;

function next() {
  screens[index].classList.remove('active');
  index++;
  screens[index].classList.add('active');
}

/* Heart spawn */
function spawnHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '❤️';
  heart.style.left = Math.random() * 90 + 'vw';
  heart.style.fontSize = (24 + Math.random()*24) + 'px';
  heart.style.animationDuration = (2 + Math.random()*3) + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 4000);
}

let heartInterval;

/* Celebrate: show message, start music, spawn hearts */
function celebrate() {
  // Show heartfelt message
  const message = document.getElementById('message');
  message.classList.add('show');

  // Start YouTube music reliably
  const yt = document.getElementById('ytplayer');
  yt.src += "&autoplay=1";

  // Spawn gentle floating hearts repeatedly
  heartInterval = setInterval(spawnHeart, 250);

  next();
}
</script>
</body>
</html>
