<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffe6ed, #ffd1dc);
  overflow: hidden;
}

/* SCREENS */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
  transition: opacity 0.8s ease, transform 0.8s ease;
  z-index: 3;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

h1 { font-size: 2.6rem; color: #b03060; }
p { font-size: 1.15rem; max-width: 520px; color: #444; line-height: 1.7; }

/* BUTTONS */
button {
  margin-top: 35px;
  padding: 16px 42px;
  border: none;
  border-radius: 50px;
  background: #ff4d6d;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 18px 45px rgba(255, 77, 109, 0.6);
  transition: transform 0.3s ease;
}

button:hover { transform: scale(1.08); }
.pulse { animation: pulse 1.4s infinite; }
@keyframes pulse { 0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);} }

/* HEARTS */
#hearts { position:absolute; inset:0; pointer-events:none; z-index:1; }
.heart { position:absolute; color:rgba(255,77,109,0.9); animation:float linear forwards; }
@keyframes float { from{transform:translateY(110vh) scale(0.8);opacity:0;}10%{opacity:1;}to{transform:translateY(-10vh) scale(1.5);opacity:0;} }

/* GOOD CHOICE */
#goodChoice {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3rem;
  font-weight: bold;
  color: #b03060;
  opacity: 0;
  transition: opacity 1s ease;
  z-index: 5;
}
</style>
</head>

<body>

<div id="hearts"></div>

<!-- SCREENS -->
<div class="screen active">
  <h1>Hey you ❤️</h1>
  <p>I made this just for you.</p>
  <button onclick="next()">Start</button>
</div>

<div class="screen">
  <h1>A little truth</h1>
  <p>You make everything feel softer.</p>
  <button onclick="next()">Next</button>
</div>

<div class="screen">
  <h1>One more thing</h1>
  <p>I feel right with you.</p>
  <button onclick="next()">Okay ❤️</button>
</div>

<div class="screen">
  <h1>Will you be my Valentine? 💘</h1>
  <button class="pulse" onclick="celebrate()">Yes</button>
</div>

<div class="screen">
  <h1>You chose me ❤️</h1>
  <p>And I’ll choose you, every time.</p>
</div>

<div id="goodChoice">Good choice ❤️</div>

<!-- MUSIC -->
<iframe id="ytplayer" width="0" height="0" src="https://www.youtube.com/embed/OLAK5uy_mlW?enablejsapi=1&autoplay=1&mute=1" allow="autoplay"></iframe>

<script>
const screens = document.querySelectorAll('.screen');
let index = 0;
let heartInterval;

/* NAVIGATION */
function next() {
  screens[index].classList.remove('active');
  index++;
  screens[index].classList.add('active');
}

/* HEARTS */
function spawnHeart(big=false) {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = '♥';
  h.style.left = Math.random() * 100 + 'vw';
  h.style.fontSize = big ? 42 + Math.random()*24 + 'px' : 18 + Math.random()*12 + 'px';
  h.style.animationDuration = big ? '2.5s' : '7s';
  document.getElementById('hearts').appendChild(h);
  setTimeout(()=>h.remove(),8000);
}

/* SLOW HEARTS BEFORE YES */
heartInterval = setInterval(()=>spawnHeart(false),700);

/* YES CLICK CELEBRATION */
function celebrate() {
  clearInterval(heartInterval);
  heartInterval = setInterval(()=>spawnHeart(true),120);

  const good = document.getElementById('goodChoice');
  good.style.opacity = 1;
  setTimeout(()=>good.style.opacity = 0,2200);

  next();

  // PLAY MUSIC
  const yt = document.getElementById('ytplayer');
  yt.src = yt.src.replace("mute=1","mute=0");
}
</script>

</body>
</html>
