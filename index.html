<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffccd5, #fff0f3);
  overflow: hidden;
}

/* SCREENS */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
  transition: opacity 1s ease, transform 1s ease;
  z-index: 3;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

h1 {
  font-size: 2.6rem;
  color: #b03060;
}

p {
  font-size: 1.15rem;
  max-width: 520px;
  color: #444;
  line-height: 1.7;
}

/* BUTTON */
button {
  margin-top: 35px;
  padding: 16px 42px;
  border: none;
  border-radius: 50px;
  background: #ff4d6d;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 18px 45px rgba(255, 77, 109, 0.6);
  transition: transform 0.3s ease;
}

button:hover {
  transform: scale(1.08);
}

.pulse {
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* HEARTS */
.hearts {
  position: absolute;
  inset: 0;
  pointer-events: auto;
  overflow: hidden;
  z-index: 2;
}

.heart {
  position: absolute;
  cursor: pointer;
  animation: float linear forwards;
  user-select: none;
}

@keyframes float {
  from {
    transform: translateY(110vh) scale(0.8);
    opacity: 0;
  }
  10% { opacity: 1; }
  to {
    transform: translateY(-10vh) scale(1.6);
    opacity: 0;
  }
}

/* POP ANIMATION */
.pop {
  animation: pop 0.4s ease forwards;
}

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  60% { transform: scale(1.8); opacity: 0.9; }
  100% { transform: scale(0); opacity: 0; }
}

/* MESSAGE BURST */
.message {
  position: absolute;
  color: #b03060;
  font-size: 1.4rem;
  font-weight: 600;
  animation: message 1.6s ease forwards;
  pointer-events: none;
}

@keyframes message {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-40px); }
}

.final {
  font-size: 2.9rem;
}
</style>
</head>

<body>

<!-- MUSIC -->
<iframe
  id="music"
  src="https://www.youtube.com/embed/VEpMj-tqixs?enablejsapi=1"
  allow="autoplay"
  style="display:none">
</iframe>

<div class="hearts" id="hearts"></div>

<!-- SCREENS -->
<div class="screen active">
  <h1>Hey you ❤️</h1>
  <p>I made this just for you.</p>
  <button onclick="next()">Start</button>
</div>

<div class="screen">
  <h1>A little truth</h1>
  <p>You make everything feel warmer.</p>
  <button onclick="next()">Next</button>
</div>

<div class="screen">
  <h1>One more thing</h1>
  <p>I don’t just like you — I really care.</p>
  <button onclick="next()">Okay ❤️</button>
</div>

<div class="screen">
  <h1 class="final">Will you be my Valentine? 💘</h1>
  <button class="pulse" onclick="celebrate()">Yes</button>
</div>

<div class="screen">
  <h1 class="final">You chose me ❤️</h1>
  <p>And I’ll choose you every time.</p>
</div>

<script>
const screens = document.querySelectorAll('.screen');
const heartsContainer = document.getElementById('hearts');
let index = 0;
let intense = false;

const messages = [
  "I love you ❤️",
  "You're beautiful",
  "You mean so much to me",
  "You make me smile",
  "I'm lucky to have you",
  "You’re amazing",
  "My favorite person"
];

function next() {
  screens[index].classList.remove('active');
  index++;
  screens[index].classList.add('active');
}

/* CREATE HEART */
function spawnHeart(big = false) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '♥';

  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = big
    ? 40 + Math.random() * 40 + 'px'
    : 22 + Math.random() * 20 + 'px';

  heart.style.color = big
    ? 'rgba(255, 60, 100, 0.9)'
    : 'rgba(255, 90, 130, 0.75)';

  heart.style.animationDuration = big
    ? 2 + Math.random() * 2 + 's'
    : 6 + Math.random() * 4 + 's';

  heart.onclick = (e) => popHeart(e, heart);

  heartsContainer.appendChild(heart);
  setTimeout(() => heart.remove(), 9000);
}

/* POP HEART */
function popHeart(e, heart) {
  heart.classList.add('pop');

  const msg = document.createElement('div');
  msg.className = 'message';
  msg.innerText = messages[Math.floor(Math.random() * messages.length)];
  msg.style.left = e.clientX + 'px';
  msg.style.top = e.clientY + 'px';

  document.body.appendChild(msg);

  setTimeout(() => {
    heart.remove();
    msg.remove();
  }, 800);
}

/* CALM HEARTS */
setInterval(() => {
  if (!intense) spawnHeart(false);
}, 900);

/* YES CLICK */
function celebrate() {
  intense = true;

  const iframe = document.getElementById('music');
  iframe.src += "&autoplay=1";

  for (let i = 0; i < 220; i++) spawnHeart(true);

  setInterval(() => {
    for (let i = 0; i < 12; i++) spawnHeart(true);
  }, 120);

  next();
}
</script>

</body>
</html>
