<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffccd5, #fff0f3);
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
  transition: opacity 1s ease, transform 1s ease;
  z-index: 2;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

h1 {
  font-size: 2.6rem;
  color: #b03060;
}

p {
  font-size: 1.15rem;
  color: #444;
  max-width: 520px;
  line-height: 1.7;
}

button {
  margin-top: 35px;
  padding: 16px 42px;
  border: none;
  border-radius: 50px;
  background: #ff4d6d;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 18px 45px rgba(255, 77, 109, 0.6);
  transition: transform 0.3s ease;
}

button:hover {
  transform: scale(1.08);
}

.pulse {
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* HEARTS */
.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}

.heart {
  position: absolute;
  color: rgba(255, 77, 109, 0.75);
  animation: float linear forwards;
}

@keyframes float {
  from {
    transform: translateY(110vh) scale(0.8);
    opacity: 0;
  }
  10% { opacity: 1; }
  to {
    transform: translateY(-10vh) scale(1.8);
    opacity: 0;
  }
}

/* LYRIC STYLE BACKGROUND */
.lyrics {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 0;
  pointer-events: none;
}

.lyric-line {
  position: absolute;
  font-size: 2rem;
  color: rgba(176, 48, 96, 0.18);
  opacity: 0;
  animation: lyricFade 6s infinite;
}

@keyframes lyricFade {
  0% { opacity: 0; transform: translateY(20px); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-20px); }
}

.final {
  font-size: 2.9rem;
}
</style>
</head>

<body>

<!-- Music -->
<iframe
  id="music"
  src="https://www.youtube.com/embed/VEpMj-tqixs?enablejsapi=1"
  allow="autoplay"
  style="display:none">
</iframe>

<div class="lyrics" id="lyrics"></div>
<div class="hearts" id="hearts"></div>

<div class="screen active">
  <h1>Hey you ❤️</h1>
  <p> I made this just for you. </p>
  <button onclick="next()">Start</button>
</div>

<div class="screen">
  <h1>A little truth</h1>
  <p>
    You make everything feel softer,
    warmer, and more meaningful.
  </p>
  <button onclick="next()">Next</button>
</div>

<div class="screen">
  <h1>One more thing</h1>
  <p>
    I don’t just like being with you —
    I feel right with you.
  </p>
  <button onclick="next()">Okay ❤️</button>
</div>

<div class="screen">
  <h1 class="final">Will you be my Valentine? 💘</h1>
  <button class="pulse" onclick="celebrate()">Yes</button>
</div>

<div class="screen">
  <h1 class="final">You chose me ❤️</h1>
  <p>And I’ll choose you, every time.</p>
</div>

<script>
const screens = document.querySelectorAll('.screen');
let index = 0;
let intense = false;

function next() {
  screens[index].classList.remove('active');
  index++;
  screens[index].classList.add('active');
}

function spawnHeart(big = false) {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '♥';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = big
    ? 40 + Math.random() * 40 + 'px'
    : 16 + Math.random() * 18 + 'px';
  heart.style.animationDuration = big
    ? 2 + Math.random() * 2 + 's'
    : 6 + Math.random() * 4 + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 8000);
}

// Slow & steady hearts at start
setInterval(() => {
  if (!intense) spawnHeart(false);
}, 800);

// Lyric-style ambience (NOT real lyrics)
const lyricPhrases = [
  "—",
  " ",
  "♪",
  " "
];

setInterval(() => {
  const line = document.createElement('div');
  line.className = 'lyric-line';
  line.innerText = lyricPhrases[Math.floor(Math.random() * lyricPhrases.length)];
  document.getElementById('lyrics').appendChild(line);
  setTimeout(() => line.remove(), 6000);
}, 2500);

function celebrate() {
  intense = true;

  // start music
  const iframe = document.getElementById('music');
  iframe.src += "&autoplay=1";

  // DROWN the screen
  for (let i = 0; i < 200; i++) spawnHeart(true);

  setInterval(() => {
    for (let i = 0; i < 12; i++) spawnHeart(true);
  }, 120);

  next();
}
</script>

</body>
</html>
