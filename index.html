<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ffccd5, #fff0f3);
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 30px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translateY(40px);
  transition: opacity 1s ease, transform 1s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

h1 {
  font-size: 2.6rem;
  color: #b03060;
}

p {
  font-size: 1.15rem;
  color: #444;
  max-width: 520px;
  line-height: 1.7;
}

button {
  margin-top: 35px;
  padding: 16px 42px;
  border: none;
  border-radius: 50px;
  background: #ff4d6d;
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 18px 45px rgba(255, 77, 109, 0.6);
  transition: transform 0.3s ease;
}

button:hover {
  transform: scale(1.08);
}

.pulse {
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.hearts {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.heart {
  position: absolute;
  color: rgba(255, 77, 109, 0.65);
  animation: float linear forwards;
}

@keyframes float {
  from {
    transform: translateY(110vh) scale(0.8);
    opacity: 0;
  }
  10% { opacity: 1; }
  to {
    transform: translateY(-10vh) scale(1.7);
    opacity: 0;
  }
}

.final {
  font-size: 2.9rem;
}
</style>
</head>

<body>

<audio id="song" loop>
  <source src="youth.mp3" type="audio/mpeg">
</audio>

<div class="hearts" id="hearts"></div>

<div class="screen active">
  <h1>Hey you ❤️</h1>
  <p> I made this just for you. </p>
  <button onclick="start()">Start</button>
</div>

<div class="screen">
  <h1>Just so you know</h1>
  <p>
    You make everything feel warmer,
    happier, and more meaningful.
  </p>
  <button onclick="next()">Next</button>
</div>

<div class="screen">
  <h1>One last thing</h1>
  <p>
    I wouldn’t want to spend this day
    with anyone else.
  </p>
  <button onclick="next()">Okay ❤️</button>
</div>

<div class="screen">
  <h1 class="final">Will you be my Valentine? 💘</h1>
  <button class="pulse" onclick="celebrate()">Yes</button>
</div>

<div class="screen">
  <h1 class="final">You chose me ❤️</h1>
  <p>And I’ll choose you, every time.</p>
</div>

<script>
const screens = document.querySelectorAll('.screen');
let index = 0;

function next() {
  screens[index].classList.remove('active');
  index++;
  screens[index].classList.add('active');
}

function start() {
  document.getElementById('song').play();
  next();
}

// INSANE HEART FLOOD
function spawnHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerText = '♥';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = 16 + Math.random() * 28 + 'px';
  heart.style.animationDuration = 3 + Math.random() * 4 + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}

setInterval(() => {
  for (let i = 0; i < 8; i++) spawnHeart();
}, 150);

function celebrate() {
  for (let i = 0; i < 150; i++) spawnHeart();
  next();
}
</script>

</body>
</html>
