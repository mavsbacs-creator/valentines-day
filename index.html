<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Surprise ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
body{margin:0;height:100vh;background:linear-gradient(135deg,#ffccd5,#fff0f3);overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;opacity:0;pointer-events:none;transform:translateY(40px);transition:opacity 1s ease,transform 1s ease;z-index:3;}
.screen.active{opacity:1;pointer-events:auto;transform:translateY(0);}
h1{font-size:2.6rem;color:#b03060;}
p{font-size:1.15rem;max-width:520px;color:#444;line-height:1.7;}
button{margin-top:35px;padding:16px 42px;border:none;border-radius:50px;background:#ff4d6d;color:white;font-size:1.1rem;cursor:pointer;box-shadow:0 18px 45px rgba(255,77,109,0.6);transition:transform 0.3s ease;}
button:hover{transform:scale(1.08);}
.pulse{animation:pulse 1.4s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
.hearts{position:absolute;inset:0;pointer-events:auto;overflow:hidden;z-index:2;}
.heart{position:absolute;cursor:pointer;animation:float linear forwards;user-select:none;}
@keyframes float{from{transform:translateY(110vh) scale(0.9);opacity:0;}10%{opacity:1;}to{transform:translateY(-10vh) scale(1.7);opacity:0;}}
.pop{animation:pop 0.35s ease forwards;}
@keyframes pop{0%{transform:scale(1);opacity:1;}60%{transform:scale(1.9);opacity:0.9;}100%{transform:scale(0);opacity:0;}}
.message{position:absolute;color:#b03060;font-size:1.4rem;font-weight:600;animation:message 1.5s ease forwards;pointer-events:none;}
@keyframes message{0%{opacity:0;transform:translateY(0);}20%{opacity:1;}100%{opacity:0;transform:translateY(-45px);}}
.final{font-size:2.9rem;}
</style>
</head>
<body>

<!-- Hearts container -->
<div class="hearts" id="hearts"></div>

<!-- Screens -->
<div class="screen active">
  <h1>Hey you ❤️</h1>
  <p>I made this just for you.</p>
  <button onclick="next()">Start</button>
</div>

<div class="screen">
  <h1>A little truth</h1>
  <p>You make everything feel warmer.</p>
  <button onclick="next()">Next</button>
</div>

<div class="screen">
  <h1>One more thing</h1>
  <p>I don’t just like you — I really care.</p>
  <button onclick="next()">Okay ❤️</button>
</div>

<div class="screen">
  <h1 class="final">Will you be my Valentine? 💘</h1>
  <button class="pulse" onclick="celebrate()">Yes</button>
</div>

<div class="screen">
  <h1 class="final">You chose me ❤️</h1>
  <p>And I’ll choose you every time.</p>
</div>

<!-- Embedded audio -->
<audio id="music" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2023/03/03/audio_1b28f0bbf4.mp3?filename=soft-inspirational-background-7186.mp3" type="audio/mpeg">
</audio>

<script>
const screens=document.querySelectorAll('.screen');
const heartsContainer=document.getElementById('hearts');
let index=0,intenseInterval=null;
const messages=["I love you ❤️","You're beautiful","You mean so much to me","You make me smile","I'm lucky to have you","You’re amazing","My favorite person"];

function next(){
  screens[index].classList.remove('active');
  index++;
  screens[index].classList.add('active');
}

function spawnHeart(){
  const heart=document.createElement('div');
  heart.className='heart';
  heart.innerText='♥';
  heart.style.left=Math.random()*100+'vw';
  heart.style.fontSize=44+Math.random()*40+'px';
  heart.style.color='rgba(255,60,100,0.9)';
  heart.style.animationDuration=2+Math.random()*2+'s';
  heart.onclick=(e)=>popHeart(e,heart);
  heartsContainer.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
}

function popHeart(e,heart){
  heart.classList.add('pop');
  const msg=document.createElement('div');
  msg.className='message';
  msg.innerText=messages[Math.floor(Math.random()*messages.length)];
  msg.style.left=e.clientX+'px';
  msg.style.top=e.clientY+'px';
  document.body.appendChild(msg);
  setTimeout(()=>{heart.remove();msg.remove();},800);
}

function celebrate(){
  // play audio
  const audio=document.getElementById('music');
  audio.currentTime=0;
  audio.play();

  // big burst
  for(let i=0;i<300;i++) spawnHeart();

  // continuous flood
  intenseInterval=setInterval(()=>{for(let i=0;i<16;i++) spawnHeart();},120);

  next();
}
</script>

</body>
</html>
